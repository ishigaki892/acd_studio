[package]
name = "atcoder-studio"
version = "0.1.2"
description = "AtCoder Studio"
authors = ["ishigaki"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atcoder_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
trash = "5.2.9"
libc = "0.2.190"
# 問題ページの HTML の読み取り（Phase 3a 作業 1）。Tauri が使っているものと同じ版（P3a-02）
dom_query = { version = "0.28.0", default-features = false }
# フォルダ全体の検索の正規表現（Phase 12 作業 2。D-183）。Tauri の依存として Cargo.lock にあった版と同じ
regex = "1.13.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
